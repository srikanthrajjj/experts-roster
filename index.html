
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Manage Volunteers Menu</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script type="module" crossorigin src="/assets/index-FwXgLDHs.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-BXCB8nBE.css">
    </head>

    <body>
      <div id="root"></div>
      <script>
        (function() {
          document.addEventListener('click', function(e) {
            var el = e.target;
            while (el && el !== document.body) {
              var txt = (el.textContent || '').trim();
              if (txt === 'Add Experts' || txt === '+ Add Experts') {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = '/admin.html';
                return;
              }
              el = el.parentElement;
            }
          }, true);
        })();
      </script>
    </body>
  </html>
